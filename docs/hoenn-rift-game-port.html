<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoenn Rift: 100-Day Protocol</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #243e67 0%, #10192b 55%, #0a111d 100%);
      color: #ecf4ff;
    }
    .rift-game {
      min-height: 100vh;
      padding: 2rem 1rem 3rem;
      max-width: 1080px;
      margin: 0 auto;
      text-align: left;
    }
    .rift-game header h1 { margin-bottom: .25rem; }
    .status-grid {
      margin-top: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: .75rem;
    }
    .status-grid > div,
    .log,
    .ending,
    .action-grid button,
    .social-links,
    .story-feed {
      border: 1px solid #2f4168;
      background: #162238;
      border-radius: 12px;
      padding: .8rem;
    }
    .action-grid {
      margin-top: 1.2rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: .8rem;
    }
    .action-grid button {
      color: inherit;
      text-align: left;
      cursor: pointer;
      width: 100%;
    }
    .action-grid button span {
      display: block;
      font-weight: 700;
      margin-bottom: .35rem;
    }
    .action-grid button small { opacity: .92; display:block; }
    .action-grid button:disabled,
    .social-links button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    .social-links,
    .story-feed,
    .ending,
    .log { margin-top: 1rem; }
    .ending button {
      margin-top: .5rem;
      padding: .55rem .8rem;
      border-radius: 8px;
      border: 0;
      cursor: pointer;
    }
    .log ul,
    .story-feed ul { margin: 0; padding-left: 1rem; }
    .classmate-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: .65rem;
      margin-top: .7rem;
    }
    .classmate-card {
      border: 1px solid #2f4168;
      border-radius: 10px;
      padding: .55rem;
      background: #1d2b46;
    }
    .classmate-card.active {
      border-color: #76b9ff;
      box-shadow: inset 0 0 0 1px #76b9ff;
    }
    .classmate-card h4 { margin: 0 0 .3rem 0; }
    .classmate-card p { margin: 0 0 .35rem 0; font-size: .9rem; opacity: .95; }
    .classmate-card button {
      border: 1px solid #4f78aa;
      background: #294165;
      color: #ecf4ff;
      border-radius: 8px;
      cursor: pointer;
      padding: .35rem .5rem;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="rift-game">
    <header>
      <h1>Hoenn Rift: 100-Day Protocol</h1>
      <p>Build power, strengthen bonds, clear badges, and rank up your 12 classmates to unlock social stories.</p>
    </header>

    <section class="status-grid" id="status"></section>

    <section class="action-grid" id="actions"></section>

    <section class="social-links">
      <h3>Classmate Links (12)</h3>
      <p id="selectedClassmateLine"></p>
      <div class="classmate-grid" id="classmateGrid"></div>
    </section>

    <section class="story-feed">
      <h3>Hangout Story Feed</h3>
      <ul id="storyFeedList"></ul>
    </section>

    <section class="ending" id="ending" hidden></section>

    <section class="log">
      <h3>Action Log</h3>
      <ul id="logList"></ul>
    </section>
  </div>

  <script>
    const CLASSMATES = [
      { id: 'maya', name: 'Maya', role: 'Class Rep' },
      { id: 'kael', name: 'Kael', role: 'Track Captain' },
      { id: 'lina', name: 'Lina', role: 'Nurse Club Lead' },
      { id: 'orion', name: 'Orion', role: 'Astronomy Nerd' },
      { id: 'yuna', name: 'Yuna', role: 'Contest Idol' },
      { id: 'dante', name: 'Dante', role: 'Mechanics Prodigy' },
      { id: 'sora', name: 'Sora', role: 'Quiet Transfer' },
      { id: 'reina', name: 'Reina', role: 'Library Keeper' },
      { id: 'taro', name: 'Taro', role: 'Chef Apprentice' },
      { id: 'ivy', name: 'Ivy', role: 'Eco Club Scout' },
      { id: 'zeph', name: 'Zeph', role: 'Battle Maniac' },
      { id: 'noel', name: 'Noel', role: 'Student Journalist' }
    ];

    const RANK_STORY_BEATS = [
      'You and {name} awkwardly introduce yourselves after class, then agree to patrol the first Rift lane together.',
      '{name} admits pressure from being the {role}, and trusts you enough to ask for battle advice.',
      'A routine hangout turns into a rescue when wild echoes appear; {name} starts relying on your calm decisions.',
      '{name} opens up about a family expectation they never wanted, and you promise to help them choose their own path.',
      'You train at sunset and discover {name} has a hidden talent that changes your strategy for the next boss.',
      'A rumor threatens {name}\'s reputation; you investigate together and clear their name before morning homeroom.',
      '{name} confesses fear of failing everyone. You tell them leadership means asking for help, not carrying everything alone.',
      'During a major Rift surge, {name} saves your squad first and admits your friendship gave them courage to act.',
      'On the eve of exams and crisis deadlines, you and {name} make a pact to face finals and fate together.',
      'Max Rank Scene: {name} chooses their future with confidence and promises to stand beside you in the final battle.'
    ];

    const createInitialSocialLinks = () => {
      const links = {};
      CLASSMATES.forEach((mate) => {
        links[mate.id] = { rank: 0, scenes: [] };
      });
      return links;
    };

    const createStartingState = () => ({
      day: 1,
      energy: 3,
      maxEnergy: 3,
      attack: 1,
      bond: 0,
      exp: 0,
      level: 1,
      badges: 0,
      hp: 24,
      maxHp: 24,
      endingUnlocked: null,
      selectedClassmateId: CLASSMATES[0].id,
      socialLinks: createInitialSocialLinks(),
      storyFeed: ['Pick a classmate, use Hang Out, and start building 10 social ranks.'],
      log: ['Welcome to Hoenn Academy. Build your squad and survive the Rift season.']
    });

    const STARTING_STATE = createStartingState();

    const WEEKLY_BOSSES = [
      { name: 'Rustboro Colossus', hp: 14, damage: 3, badge: 'Stone' },
      { name: 'Mauville Surge Beast', hp: 18, damage: 4, badge: 'Dynamo' },
      { name: 'Fortree Sky Tyrant', hp: 22, damage: 5, badge: 'Feather' },
      { name: 'Sootopolis Rift Core', hp: 30, damage: 6, badge: 'Rain' }
    ];

    const ACTIVITY_CARD = [
      { key: 'train', title: 'Train Squad', text: '+1 Attack, +2 EXP. Better damage for dungeon runs.' },
      { key: 'social', title: 'Hang Out', text: 'Spend time with selected classmate to raise Bond and social ranks.' },
      { key: 'job', title: 'Part-time Job', text: '+1 Max HP and full heal. Keeps late game stable.' },
      { key: 'dungeon', title: 'Rift Dive', text: 'Fight enemies for EXP and badges. Risky but required to win.' }
    ];

    let game = createStartingState();

    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const addLog = (message) => { game.log = [message, ...game.log].slice(0, 12); };
    const addStoryFeed = (scene) => { game.storyFeed = [scene, ...game.storyFeed].slice(0, 14); };

    const getCurrentBoss = () => {
      const weekIndex = Math.min(Math.floor((game.day - 1) / 25), WEEKLY_BOSSES.length - 1);
      return WEEKLY_BOSSES[weekIndex];
    };

    const getClassmate = (id) => CLASSMATES.find((mate) => mate.id === id);

    const getHangoutStory = (mate, rank) => {
      const base = RANK_STORY_BEATS[rank - 1] || RANK_STORY_BEATS[RANK_STORY_BEATS.length - 1];
      return base.replaceAll('{name}', mate.name).replaceAll('{role}', mate.role);
    };

    const getTotalSocialRanks = () => {
      return CLASSMATES.reduce((sum, mate) => sum + game.socialLinks[mate.id].rank, 0);
    };

    const levelUpIfNeeded = () => {
      while (game.exp >= game.level * 8) {
        game.exp -= game.level * 8;
        game.level += 1;
        game.attack += 1;
        game.maxHp += 2;
        game.hp = game.maxHp;
        addLog(`Level up! You reached level ${game.level}. HP fully restored.`);
      }
    };

    const checkEndings = () => {
      if (game.hp <= 0) {
        game.endingUnlocked = 'bad';
        addLog('Bad ending: your team collapsed in the Rift. Restart and plan your days better.');
        return;
      }
      if (game.day > 100) {
        const totalRanks = getTotalSocialRanks();
        if (game.badges >= 8 && game.bond >= 20 && totalRanks >= 70) {
          game.endingUnlocked = 'true';
          addLog('True ending unlocked! You prevented the apocalypse and united most of your classmates.');
        } else if (game.badges >= 6) {
          game.endingUnlocked = 'good';
          addLog('Good ending unlocked! Crisis stopped, but some classmate stories remain unresolved.');
        } else {
          game.endingUnlocked = 'normal';
          addLog('Normal ending: you reached the final day without enough badges to fully stop the Rift.');
        }
      }
    };

    const resolveHangout = () => {
      const mate = getClassmate(game.selectedClassmateId);
      const link = game.socialLinks[mate.id];

      game.bond += 2;
      game.hp = clamp(game.hp + 3, 0, game.maxHp);

      if (link.rank >= 10) {
        addLog(`You spent quality time with ${mate.name}. Their social link is already max rank.`);
        return;
      }

      link.rank += 1;
      const story = getHangoutStory(mate, link.rank);
      const sceneLabel = `${mate.name} Rank ${link.rank}: ${story}`;
      link.scenes.push(sceneLabel);

      addStoryFeed(sceneLabel);
      addLog(`Hangout complete with ${mate.name}. Social rank increased to ${link.rank}.`);
    };

    const onAction = (type) => {
      if (game.energy <= 0 || game.endingUnlocked) return;

      game.energy -= 1;
      const currentBoss = getCurrentBoss();

      if (type === 'train') {
        game.attack += 1;
        game.exp += 2;
        addLog('Training complete: Attack increased and technique improved.');
      }

      if (type === 'social') {
        resolveHangout();
      }

      if (type === 'job') {
        game.maxHp += 1;
        game.hp = game.maxHp;
        addLog('You worked an evening shift. Max HP rose and supplies restored your squad.');
      }

      if (type === 'dungeon') {
        const enemyHit = Math.floor(Math.random() * (currentBoss.damage + 1));
        const playerHit = game.attack + Math.floor(Math.random() * 4);
        game.hp = clamp(game.hp - enemyHit, 0, game.maxHp);
        game.exp += 4;

        if (playerHit >= currentBoss.hp / 3) {
          game.badges += 1;
          addLog(`Rift victory! You defeated an elite echo of ${currentBoss.name} and earned a badge fragment.`);
        } else {
          addLog(`Rift run cleared. You dealt ${playerHit} damage and took ${enemyHit}. Train more for boss-tier clears.`);
        }
      }

      levelUpIfNeeded();

      if (game.energy === 0) {
        game.day += 1;
        game.energy = game.maxEnergy;
        addLog(`Day ${game.day} begins. Choose wisely: only ${game.maxEnergy} actions today.`);
      }

      checkEndings();
      render();
    };

    const resetGame = () => {
      game = createStartingState();
      render();
    };

    const render = () => {
      const currentBoss = getCurrentBoss();
      const selectedClassmate = getClassmate(game.selectedClassmateId);
      const selectedRank = game.socialLinks[selectedClassmate.id].rank;
      const totalRanks = getTotalSocialRanks();

      const status = [
        ['Day:', `${game.day}/100`],
        ['Energy:', `${game.energy}/${game.maxEnergy}`],
        ['Level:', game.level],
        ['HP:', `${game.hp}/${game.maxHp}`],
        ['Attack:', game.attack],
        ['Bond:', game.bond],
        ['Badges:', game.badges],
        ['Total Social Ranks:', `${totalRanks}/120`],
        ['Current threat:', `${currentBoss.name} (${currentBoss.badge} Badge)`]
      ];

      const statusEl = document.getElementById('status');
      statusEl.innerHTML = '';
      status.forEach(([label, value]) => {
        const node = document.createElement('div');
        node.innerHTML = `<strong>${label}</strong> ${String(value)}`;
        statusEl.appendChild(node);
      });

      const actionsEl = document.getElementById('actions');
      actionsEl.innerHTML = '';
      ACTIVITY_CARD.forEach((activity) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.disabled = Boolean(game.endingUnlocked) || game.energy <= 0;

        const actionTitle = activity.key === 'social'
          ? `${activity.title}: ${selectedClassmate.name} (Rank ${selectedRank}/10)`
          : activity.title;

        btn.innerHTML = `<span>${actionTitle}</span><small>${activity.text}</small>`;
        btn.addEventListener('click', () => onAction(activity.key));
        actionsEl.appendChild(btn);
      });

      document.getElementById('selectedClassmateLine').textContent =
        `Selected classmate: ${selectedClassmate.name} (${selectedClassmate.role}) — Rank ${selectedRank}/10`;

      const classmateGrid = document.getElementById('classmateGrid');
      classmateGrid.innerHTML = '';
      CLASSMATES.forEach((mate) => {
        const rank = game.socialLinks[mate.id].rank;
        const card = document.createElement('article');
        card.className = `classmate-card ${mate.id === game.selectedClassmateId ? 'active' : ''}`;

        const title = document.createElement('h4');
        title.textContent = `${mate.name} — Rank ${rank}/10`;

        const role = document.createElement('p');
        role.textContent = mate.role;

        const pickBtn = document.createElement('button');
        pickBtn.type = 'button';
        pickBtn.textContent = mate.id === game.selectedClassmateId ? 'Selected' : `Select ${mate.name}`;
        pickBtn.disabled = mate.id === game.selectedClassmateId;
        pickBtn.addEventListener('click', () => {
          game.selectedClassmateId = mate.id;
          render();
        });

        card.appendChild(title);
        card.appendChild(role);
        card.appendChild(pickBtn);
        classmateGrid.appendChild(card);
      });

      const storyFeedList = document.getElementById('storyFeedList');
      storyFeedList.innerHTML = '';
      game.storyFeed.forEach((scene) => {
        const li = document.createElement('li');
        li.textContent = scene;
        storyFeedList.appendChild(li);
      });

      const endingEl = document.getElementById('ending');
      if (game.endingUnlocked) {
        endingEl.hidden = false;
        endingEl.innerHTML = `<h2>Run complete: ${game.endingUnlocked.toUpperCase()} ENDING</h2>`;
        const resetBtn = document.createElement('button');
        resetBtn.type = 'button';
        resetBtn.textContent = 'Start New Run';
        resetBtn.addEventListener('click', resetGame);
        endingEl.appendChild(resetBtn);
      } else {
        endingEl.hidden = true;
        endingEl.innerHTML = '';
      }

      const logList = document.getElementById('logList');
      logList.innerHTML = '';
      game.log.forEach((line) => {
        const li = document.createElement('li');
        li.textContent = line;
        logList.appendChild(li);
      });
    };

    render();
  </script>
</body>
</html>
